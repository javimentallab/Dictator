name: Trivy

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Trivy (vulnerabilities + secrets + misconfiguration)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" -w /src \
            ghcr.io/aquasecurity/trivy:0.65.0 fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 1 --no-progress .

      - name: SARIF report for GitHub Security
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" -w /src \
            ghcr.io/aquasecurity/trivy:0.65.0 fs \
            --scanners vuln,secret,misconfig \
            --format sarif --output trivy-results.sarif --no-progress .

      - name: Upload to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif

  tests:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
